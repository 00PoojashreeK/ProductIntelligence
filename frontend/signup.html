<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        ProductIQ - Signup
    </title>


    <!-- MAIN CSS -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/innovative.css"
    >

    <link
        rel="stylesheet"
        href="css/premium.css"
    >

    <link
        rel="stylesheet"
        href="css/theme-contrast-fix.css"
    >

    <link
        rel="stylesheet"
        href="css/global-polish.css"
    >

    <link
        rel="stylesheet"
        href="css/final-theme-fix.css"
    >

    <script src="js/global-theme.js"></script>

    <link
        rel="stylesheet"
        href="css/theme-repair-v2.css"
    >


    <!-- =====================================================
         PASSWORD EYE ICON
    ====================================================== -->

    <style>

        .password-wrapper {
            position: relative;
            width: 100%;
        }


        .password-wrapper input {
            width: 100%;
            padding-right: 50px;
            box-sizing: border-box;
        }


        .password-toggle {
            position: absolute;

            right: 10px;
            top: 50%;

            transform: translateY(-50%);

            width: 36px;
            height: 36px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0;
            margin: 0;

            border: none;
            outline: none;

            background: transparent;

            color: #64748b;

            cursor: pointer;

            z-index: 20;
        }


        .password-toggle:hover {
            color: #2563eb;
        }


        .password-toggle:focus {
            outline: none;
        }


        .eye-icon {
            width: 21px;
            height: 21px;

            display: block;

            pointer-events: none;
        }


        /* DARK MODE */

        body.pi-dark .password-toggle {
            color: #cbd5e1;
        }


        body.pi-dark .password-toggle:hover {
            color: #ffffff;
        }

    </style>

</head>


<body>


<div class="auth-container">


    <div class="auth-card">


        <!-- =================================================
             TITLE
        ================================================== -->

        <h1>
            ProductIQ
        </h1>


        <h2>
            Create Account
        </h2>


        <!-- =================================================
             SIGNUP FORM
        ================================================== -->

        <form id="signupForm">


            <!-- USERNAME -->

            <label>
                Username
            </label>


            <input
                type="text"
                id="name"
                placeholder="Enter your username"
                autocomplete="username"
                required
            >


            <!-- EMAIL -->

            <label>
                Email
            </label>


            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >


            <!-- PASSWORD -->

            <label>
                Password
            </label>


            <div class="password-wrapper">


                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="new-password"
                    required
                >


                <!-- EYE BUTTON -->

                <button
                    type="button"
                    id="passwordToggle"
                    class="password-toggle"
                    aria-label="Show password"
                    title="Show password"
                >

                    <!-- EYE ICON -->

                    <svg
                        id="eyeIcon"
                        class="eye-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                    >

                        <path
                            d="M2 12C2 12 5.5 6 12 6C18.5 6 22 12 22 12C22 12 18.5 18 12 18C5.5 18 2 12 2 12Z"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />

                        <circle
                            cx="12"
                            cy="12"
                            r="3"
                            stroke="currentColor"
                            stroke-width="2"
                        />

                    </svg>

                </button>

            </div>


            <!-- CREATE ACCOUNT BUTTON -->

            <button
                type="submit"
            >
                Create Account
            </button>


        </form>


        <!-- MESSAGE -->

        <p id="message"></p>


        <!-- LOGIN -->

        <p>

            Already have an account?

            <a href="index.html">
                Login
            </a>

        </p>


    </div>


</div>



<script>


/* =====================================================
   PASSWORD SHOW / HIDE
===================================================== */

const passwordInput =
    document.getElementById("password");


const passwordToggle =
    document.getElementById("passwordToggle");


const eyeIcon =
    document.getElementById("eyeIcon");


passwordToggle.addEventListener(
    "click",
    function() {


        /* SHOW PASSWORD */

        if (
            passwordInput.type === "password"
        ) {

            passwordInput.type = "text";


            eyeIcon.innerHTML = `

                <path
                    d="M2 12C2 12 5.5 6 12 6C18.5 6 22 12 22 12C22 12 18.5 18 12 18C5.5 18 2 12 2 12Z"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />

                <circle
                    cx="12"
                    cy="12"
                    r="3"
                    stroke="currentColor"
                    stroke-width="2"
                />

            `;


            passwordToggle.setAttribute(
                "aria-label",
                "Hide password"
            );


            passwordToggle.setAttribute(
                "title",
                "Hide password"
            );

        }


        /* HIDE PASSWORD */

        else {

            passwordInput.type = "password";


            eyeIcon.innerHTML = `

                <path
                    d="M3 3L21 21"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                />

                <path
                    d="M2 12C2 12 5.5 6 12 6C18.5 6 22 12 22 12C22 12 18.5 18 12 18C5.5 18 2 12 2 12Z"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />

                <circle
                    cx="12"
                    cy="12"
                    r="3"
                    stroke="currentColor"
                    stroke-width="2"
                />

            `;


            passwordToggle.setAttribute(
                "aria-label",
                "Show password"
            );


            passwordToggle.setAttribute(
                "title",
                "Show password"
            );

        }

    }
);



/* =====================================================
   SIGNUP FORM
===================================================== */

document
    .getElementById("signupForm")
    .addEventListener(
        "submit",
        function(event) {


            event.preventDefault();


            const name =
                document
                    .getElementById("name")
                    .value
                    .trim();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            /*
               Store user information
            */

            localStorage.setItem(
                "user",
                JSON.stringify({

                    name: name,

                    email: email

                })
            );


            /*
               Success message
            */

            document
                .getElementById("message")
                .innerText =
                "Account created successfully!";


            /*
               Go to login page
            */

            setTimeout(
                function() {

                    window.location.href =
                        "index.html";

                },
                800
            );

        }
    );

</script>


<script src="js/intelligence.js"></script>


</body>

</html>

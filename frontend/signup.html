<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        ProductIQ - Signup
    </title>


    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<div class="auth-container">

    <div class="auth-card">

        <h1>
            🏭 ProductIQ
        </h1>


        <h2>
            Create Account
        </h2>


        <form id="signupForm">

            <label>
                Name
            </label>


            <input
                type="text"
                id="name"
                required
            >


            <label>
                Email
            </label>


            <input
                type="email"
                id="email"
                required
            >


            <label>
                Password
            </label>


            <input
                type="password"
                id="password"
                required
            >


            <button
                type="submit"
            >
                Create Account
            </button>

        </form>


        <p id="message"></p>


        <p>

            Already have an account?

            <a href="index.html">
                Login
            </a>

        </p>

    </div>

</div>


<script>

document
    .getElementById("signupForm")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const name =
                document.getElementById(
                    "name"
                ).value.trim();


            const email =
                document.getElementById(
                    "email"
                ).value.trim();


            const password =
                document.getElementById(
                    "password"
                ).value;


            localStorage.setItem(
                "user",
                JSON.stringify({
                    name: name,
                    email: email
                })
            );


            document.getElementById(
                "message"
            ).innerText =
                "Account created successfully!";


            setTimeout(
                function() {

                    window.location.href =
                        "index.html";

                },
                800
            );

        }
    );

</script>


</body>

</html>

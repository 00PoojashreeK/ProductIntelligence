```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        ProductIQ - Signup
    </title>


    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link rel="stylesheet" href="css/innovative.css">
    <link rel="stylesheet" href="css/premium.css">
    <link rel="stylesheet" href="css/theme-contrast-fix.css">

    <link rel="stylesheet" href="css/global-polish.css">
    <link rel="stylesheet" href="css/final-theme-fix.css">
    <script src="js/global-theme.js"></script>
    <link rel="stylesheet" href="css/theme-repair-v2.css">


    <!-- PASSWORD EYE ICON STYLE -->
    <style>

        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper input {
            width: 100%;
            padding-right: 50px;
            box-sizing: border-box;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);

            border: none;
            background: transparent;

            cursor: pointer;

            font-size: 18px;
            padding: 5px;

            line-height: 1;
        }

        .password-toggle:hover {
            opacity: 0.7;
        }

    </style>

</head>


<body>


<div class="auth-container">


    <div class="auth-card">


        <h1>
            ProductIQ
        </h1>


        <h2>
            Create Account
        </h2>


        <form id="signupForm">


            <!-- USERNAME -->

            <label>
                Username
            </label>


            <input
                type="text"
                id="name"
                placeholder="Enter your username"
                required
            >


            <!-- EMAIL -->

            <label>
                Email
            </label>


            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <!-- PASSWORD -->

            <label>
                Password
            </label>


            <div class="password-wrapper">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <button
                    type="button"
                    id="passwordToggle"
                    class="password-toggle"
                    aria-label="Show password"
                >
                    👁
                </button>

            </div>


            <!-- CREATE ACCOUNT BUTTON -->

            <button
                type="submit"
            >
                Create Account
            </button>


        </form>


        <p id="message"></p>


        <p>

            Already have an account?

            <a href="index.html">
                Login
            </a>

        </p>


    </div>


</div>


<script>


/* =====================================================
   PASSWORD SHOW / HIDE
===================================================== */

const passwordInput =
    document.getElementById("password");

const passwordToggle =
    document.getElementById("passwordToggle");


passwordToggle.addEventListener(
    "click",
    function() {

        if (
            passwordInput.type === "password"
        ) {

            passwordInput.type = "text";

            passwordToggle.textContent = "🙈";

            passwordToggle.setAttribute(
                "aria-label",
                "Hide password"
            );

        }

        else {

            passwordInput.type = "password";

            passwordToggle.textContent = "👁";

            passwordToggle.setAttribute(
                "aria-label",
                "Show password"
            );

        }

    }
);



/* =====================================================
   SIGNUP FORM
===================================================== */

document
    .getElementById("signupForm")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const name =
                document.getElementById(
                    "name"
                ).value.trim();


            const email =
                document.getElementById(
                    "email"
                ).value.trim();


            const password =
                document.getElementById(
                    "password"
                ).value;


            localStorage.setItem(
                "user",
                JSON.stringify({

                    name: name,

                    email: email

                })
            );


            document.getElementById(
                "message"
            ).innerText =
                "Account created successfully!";


            setTimeout(
                function() {

                    window.location.href =
                        "index.html";

                },
                800
            );

        }
    );

</script>


<script src="js/intelligence.js"></script>

</body>

</html>
```

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Product Intelligence AI - Login</title>


    <!-- MAIN CSS FILES -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/innovative.css">
    <link rel="stylesheet" href="css/premium.css">
    <link rel="stylesheet" href="css/theme-contrast-fix.css">
    <link rel="stylesheet" href="css/global-polish.css">
    <link rel="stylesheet" href="css/final-theme-fix.css">
    <link rel="stylesheet" href="css/theme-repair-v2.css">

    <script src="js/global-theme.js"></script>


    <!-- PASSWORD EYE ICON -->
    <style>

        .login-password-wrapper {
            position: relative;
            width: 100%;
        }

        .login-password-wrapper input {
            width: 100% !important;
            padding-right: 55px !important;
        }

        .login-eye-button {
            position: absolute !important;

            right: 12px !important;
            top: 50% !important;

            transform: translateY(-50%) !important;

            width: 35px !important;
            height: 35px !important;

            padding: 0 !important;
            margin: 0 !important;

            display: flex !important;
            align-items: center !important;
            justify-content: center !important;

            background: transparent !important;
            border: none !important;
            box-shadow: none !important;

            color: #ffffff !important;

            font-size: 20px !important;

            cursor: pointer !important;
        }

        .login-eye-button:hover {
            transform: translateY(-50%) !important;
            background: transparent !important;
            box-shadow: none !important;
            opacity: 0.75;
        }

        /* Light theme */
        body.pi-light .login-eye-button {
            color: #344054 !important;
        }

    </style>

</head>


<body>


<div class="auth-container">


    <div class="auth-card">


        <h1>
            Product Intelligence AI
        </h1>


        <p class="subtitle">
            AI-powered product intelligence platform
        </p>


        <h2>
            Login
        </h2>


        <form id="loginForm">


            <!-- EMAIL -->

            <label for="email">
                Email
            </label>


            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <!-- PASSWORD -->

            <label for="password">
                Password
            </label>


            <div class="login-password-wrapper">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button
                    type="button"
                    id="loginPasswordToggle"
                    class="login-eye-button"
                    aria-label="Show password"
                >
                    👁
                </button>

            </div>


            <!-- LOGIN BUTTON -->

            <button type="submit">
                Login
            </button>


            <p id="message"></p>


        </form>


        <p style="text-align:center; margin-top:20px;">

            Don't have an account?

            <a href="signup.html">
                Create Account
            </a>

        </p>


    </div>


</div>


<!-- PASSWORD SHOW/HIDE SCRIPT -->

<script>

const loginPassword =
    document.getElementById("password");

const loginPasswordToggle =
    document.getElementById("loginPasswordToggle");


loginPasswordToggle.addEventListener(
    "click",
    function () {

        if (loginPassword.type === "password") {

            loginPassword.type = "text";

            loginPasswordToggle.textContent = "🙈";

            loginPasswordToggle.setAttribute(
                "aria-label",
                "Hide password"
            );

        }

        else {

            loginPassword.type = "password";

            loginPasswordToggle.textContent = "👁";

            loginPasswordToggle.setAttribute(
                "aria-label",
                "Show password"
            );

        }

    }
);

</script>


<script src="js/auth.js"></script>

<script src="js/intelligence.js"></script>


</body>

</html>

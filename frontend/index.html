<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Product Intelligence AI - Login</title>


    <!-- CSS FILES -->

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/innovative.css">
    <link rel="stylesheet" href="css/premium.css">
    <link rel="stylesheet" href="css/theme-contrast-fix.css">
    <link rel="stylesheet" href="css/global-polish.css">
    <link rel="stylesheet" href="css/final-theme-fix.css">
    <link rel="stylesheet" href="css/theme-repair-v2.css">

    <script src="js/global-theme.js"></script>


    <!-- =========================================
         CLEAN PASSWORD EYE
    ========================================== -->

    <style>

        /* Password container */

        .login-password-wrapper {
            position: relative !important;
            width: 100% !important;
        }


        /* Password input */

        .login-password-wrapper input {
            width: 100% !important;
            padding-right: 48px !important;
        }


        /* Eye button */

        #loginPasswordToggle {
            position: absolute !important;

            right: 8px !important;
            top: 50% !important;

            transform: translateY(-50%) !important;

            width: 32px !important;
            height: 32px !important;

            padding: 0 !important;
            margin: 0 !important;

            display: flex !important;

            align-items: center !important;
            justify-content: center !important;

            background: transparent !important;

            border: 0 !important;

            box-shadow: none !important;

            cursor: pointer !important;

            z-index: 100 !important;
        }


        /* Remove button effects */

        #loginPasswordToggle:hover,
        #loginPasswordToggle:focus,
        #loginPasswordToggle:active {
            background: transparent !important;

            border: 0 !important;

            box-shadow: none !important;

            transform: translateY(-50%) !important;
        }


        /* =========================================
           DRAW THE EYE
        ========================================== */

        .eye-icon {
            position: relative;

            width: 19px;
            height: 12px;

            border: 2px solid #94a3b8;

            border-radius: 80% 20%;

            transform: rotate(45deg);

            display: block;
        }


        /* Eye pupil */

        .eye-icon::after {
            content: "";

            position: absolute;

            width: 5px;
            height: 5px;

            background: #94a3b8;

            border-radius: 50%;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);
        }


        /* Hover */

        #loginPasswordToggle:hover .eye-icon {
            border-color: #e2e8f0;
        }

        #loginPasswordToggle:hover .eye-icon::after {
            background: #e2e8f0;
        }


        /* =========================================
           HIDDEN EYE
        ========================================== */

        .eye-hidden {
            width: 19px;
            height: 2px;

            background: #94a3b8;

            display: block;

            transform: rotate(-45deg);

            position: relative;
        }


        .eye-hidden::before {
            content: "";

            position: absolute;

            width: 19px;
            height: 2px;

            background: #94a3b8;

            top: 0;
            left: 0;
        }


        /* Light theme */

        body.pi-light #loginPasswordToggle .eye-icon {
            border-color: #667085;
        }

        body.pi-light #loginPasswordToggle .eye-icon::after {
            background: #667085;
        }

        body.pi-light #loginPasswordToggle:hover .eye-icon {
            border-color: #344054;
        }

        body.pi-light #loginPasswordToggle:hover .eye-icon::after {
            background: #344054;
        }

    </style>

</head>


<body>


<div class="auth-container">


    <div class="auth-card">


        <h1>
            Product Intelligence AI
        </h1>


        <p class="subtitle">
            AI-powered product intelligence platform
        </p>


        <h2>
            Login
        </h2>


        <form id="loginForm">


            <!-- EMAIL -->

            <label for="email">
                Email
            </label>


            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <!-- PASSWORD -->

            <label for="password">
                Password
            </label>


            <div class="login-password-wrapper">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <!-- CLEAN EYE BUTTON -->

                <button
                    type="button"
                    id="loginPasswordToggle"
                    aria-label="Show password"
                >

                    <span class="eye-icon"></span>

                </button>

            </div>


            <!-- LOGIN -->

            <button type="submit">
                Login
            </button>


            <p id="message"></p>


        </form>


        <!-- SIGN UP -->

        <p style="text-align:center; margin-top:20px;">

            Don't have an account?

            <a href="signup.html">
                Create Account
            </a>

        </p>


    </div>


</div>


<!-- =========================================
     PASSWORD SHOW / HIDE
========================================= -->

<script>

const loginPassword =
    document.getElementById("password");


const loginPasswordToggle =
    document.getElementById("loginPasswordToggle");


loginPasswordToggle.addEventListener(
    "click",
    function () {

        if (loginPassword.type === "password") {

            /* SHOW PASSWORD */

            loginPassword.type = "text";

            loginPasswordToggle.innerHTML =
                '<span class="eye-hidden"></span>';

            loginPasswordToggle.setAttribute(
                "aria-label",
                "Hide password"
            );

        }

        else {

            /* HIDE PASSWORD */

            loginPassword.type = "password";

            loginPasswordToggle.innerHTML =
                '<span class="eye-icon"></span>';

            loginPasswordToggle.setAttribute(
                "aria-label",
                "Show password"
            );

        }

    }
);

</script>


<script src="js/auth.js"></script>

<script src="js/intelligence.js"></script>


</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Product Intelligence AI - Login</title>


    <!-- CSS FILES -->

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/innovative.css">
    <link rel="stylesheet" href="css/premium.css">
    <link rel="stylesheet" href="css/theme-contrast-fix.css">
    <link rel="stylesheet" href="css/global-polish.css">
    <link rel="stylesheet" href="css/final-theme-fix.css">
    <link rel="stylesheet" href="css/theme-repair-v2.css">

    <script src="js/global-theme.js"></script>


    <!-- PASSWORD EYE -->

    <style>

        /* Password field container */

        .password-field {
            position: relative !important;
            width: 100% !important;
        }


        /* Password input */

        .password-field input {
            width: 100% !important;

            padding-right: 48px !important;
        }


        /* 
           IMPORTANT:
           This is NOT a button.
           Therefore global button CSS
           cannot make it blue.
        */

        .password-eye {
            position: absolute !important;

            right: 12px !important;
            top: 50% !important;

            transform: translateY(-50%) !important;

            width: 22px !important;
            height: 22px !important;

            display: flex !important;

            align-items: center !important;
            justify-content: center !important;

            cursor: pointer !important;

            z-index: 999 !important;

            user-select: none !important;

            color: #94a3b8 !important;

            font-size: 18px !important;

            background: transparent !important;

            border: none !important;

            box-shadow: none !important;
        }


        /* Eye hover */

        .password-eye:hover {
            color: #ffffff !important;

            background: transparent !important;

            box-shadow: none !important;
        }


        /* Simple eye */

        .eye-shape {
            position: relative;

            width: 18px;
            height: 11px;

            border: 1.8px solid #94a3b8;

            border-radius: 70% 30%;

            transform: rotate(45deg);

            display: block;
        }


        /* Eye pupil */

        .eye-shape::after {

            content: "";

            position: absolute;

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: #94a3b8;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

        }


        /* Hover eye */

        .password-eye:hover .eye-shape {
            border-color: #ffffff;
        }


        .password-eye:hover .eye-shape::after {
            background: #ffffff;
        }


        /* Hidden-password line */

        .eye-off {

            position: relative;

            width: 20px;
            height: 2px;

            background: #94a3b8;

            transform: rotate(-45deg);

            display: block;

        }


        /* Light theme */

        body.pi-light .password-eye {
            color: #667085 !important;
        }


        body.pi-light .eye-shape {
            border-color: #667085;
        }


        body.pi-light .eye-shape::after {
            background: #667085;
        }


        body.pi-light .password-eye:hover .eye-shape {
            border-color: #344054;
        }


        body.pi-light .password-eye:hover .eye-shape::after {
            background: #344054;
        }

    </style>

</head>


<body>


<div class="auth-container">


    <div class="auth-card">


        <h1>
            Product Intelligence AI
        </h1>


        <p class="subtitle">
            AI-powered product intelligence platform
        </p>


        <h2>
            Login
        </h2>


        <form id="loginForm">


            <!-- EMAIL -->

            <label for="email">
                Email
            </label>


            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <!-- PASSWORD -->

            <label for="password">
                Password
            </label>


            <div class="password-field">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <!-- EYE ICON -->

                <span
                    class="password-eye"
                    id="passwordEye"
                    role="button"
                    tabindex="0"
                    aria-label="Show password"
                >

                    <span class="eye-shape"></span>

                </span>

            </div>


            <!-- LOGIN BUTTON -->

            <button type="submit">
                Login
            </button>


            <p id="message"></p>


        </form>


        <!-- CREATE ACCOUNT -->

        <p style="text-align:center; margin-top:20px;">

            Don't have an account?

            <a href="signup.html">
                Create Account
            </a>

        </p>


    </div>


</div>


<!-- PASSWORD SHOW / HIDE -->

<script>

const password =
    document.getElementById("password");


const passwordEye =
    document.getElementById("passwordEye");


function togglePassword() {

    if (password.type === "password") {

        password.type = "text";

        passwordEye.innerHTML =
            '<span class="eye-off"></span>';

        passwordEye.setAttribute(
            "aria-label",
            "Hide password"
        );

    }

    else {

        password.type = "password";

        passwordEye.innerHTML =
            '<span class="eye-shape"></span>';

        passwordEye.setAttribute(
            "aria-label",
            "Show password"
        );

    }

}


passwordEye.addEventListener(
    "click",
    togglePassword
);


passwordEye.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" ||
            event.key === " "
        ) {

            event.preventDefault();

            togglePassword();

        }

    }
);

</script>


<!-- YOUR EXISTING LOGIN JAVASCRIPT -->

<script src="js/auth.js"></script>

<script src="js/intelligence.js"></script>


</body>

</html>

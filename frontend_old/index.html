<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Product Intelligence AI - Login</title>

    <link rel="stylesheet"
          href="css/style.css">
    <link rel="stylesheet" href="css/innovative.css">

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>Product Intelligence AI</h1>

            <p class="subtitle">
                AI-powered product intelligence platform
            </p>

            <h2>Login</h2>

            <form id="loginForm">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">
                    Login
                </button>

                <p id="message"></p>

            </form>

            <p style="text-align:center; margin-top:20px;">
                Don't have an account?
                <a href="signup.html">
                    Create Account
                </a>
            </p>

        </div>

    </div>

    <script src="js/auth.js"></script>

</body>

</html>
